# CI on forgejo.blem.ch (the mirror github-mirror/graphics-engine), shaped like
# decade's: GCC carries the format and sanitizer gates, clang carries
# clang-tidy. `runner-laptop-omen` keeps the C++ build off homelab.
name: build
on:
  push:
    branches: [main]

# The dependency list stands in both jobs because it gets installed BEFORE the
# checkout: actions/checkout is a JS action and needs node and git in the bare
# container, so no file from the repository can carry the list yet.
# ubuntu:26.04 ends at LLVM 22 and a GCC 16 snapshot; LLVM 23, the version the
# developer machines run, comes from apt.llvm.org, its key bound to that source.
jobs:
  gcc:
    runs-on: runner-laptop-omen
    container:
      image: ubuntu:26.04
    steps:
      - name: Toolchain and dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main' \
            > /etc/apt/sources.list.d/apt.llvm.org.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nodejs git cmake ninja-build pkg-config g++-16 clang-format-23 \
            libepoxy-dev libpng-dev libfreetype-dev libicu-dev \
            libglm-dev libmsgsl-dev libgtest-dev
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: clang-format gate
        run: |
          git ls-files '*.hpp' '*.cpp' | grep -v '^external/' \
            | xargs clang-format-23 --dry-run -Werror
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16
      - name: Build
        run: ninja -C build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Sanitizer gate (address, leak, undefined, float checks)
        run: cmake --build build --target sanitize-address

  clang:
    runs-on: runner-laptop-omen
    container:
      image: ubuntu:26.04
    steps:
      - name: Toolchain and dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main' \
            > /etc/apt/sources.list.d/apt.llvm.org.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nodejs git cmake ninja-build pkg-config clang-23 clang-tidy-23 \
            libepoxy-dev libpng-dev libfreetype-dev libicu-dev \
            libglm-dev libmsgsl-dev libgtest-dev
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Versioned, not the `clang` metapackage: that one points at 21 on
      # ubuntu:26.04. CMakeLists picks the matching run-clang-tidy off the
      # compiler version, so this one line steers both.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
      - name: Build
        run: ninja -C build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: clang-tidy gate
        run: cmake --build build --target clang-tidy
